# Hosted-demo model config. Same aliases as the local stack, so application
# code is unchanged; providers swap underneath:
#   chat-local  -> Groq hosted gpt-oss-20b (cheap lane, was local Ollama)
#   chat-cloud  -> Groq gpt-oss-120b (escalation lane; swap for gpt-4o-mini
#                  by setting model back and providing OPENAI_API_KEY)
# (Groq moved the Llama 3.x models to enterprise-only in 2026; gpt-oss is
#  the current free-tier family.)
#   embed-local -> Jina embeddings v3 (OpenAI-compatible)
model_list:
  - model_name: chat-local
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  - model_name: chat-cloud
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: embed-local
    litellm_params:
      model: openai/jina-embeddings-v3
      api_base: https://api.jina.ai/v1
      api_key: os.environ/JINA_API_KEY

router_settings:
  fallbacks: [{"chat-local": ["chat-cloud"]}]
  timeout: 120
  num_retries: 1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  max_budget: 5.0
  budget_duration: 30d
  # 512MB free-tier container: no database attached, so the spend/error log
  # writers and the budget-reset job are pure memory overhead. Disable them.
  disable_spend_logs: true
  disable_error_logs: true
  disable_reset_budget: true

litellm_settings:
  drop_params: true
  cache: false
  turn_off_message_logging: true
