# One-click-ish blueprint for the $0 hosted demo.
# External prerequisites (free tiers): Upstash Redis, Neon Postgres (pgvector),
# Groq API key, Jina API key. Vercel hosts web/ separately.
services:
  - type: web
    name: tokenroute-litellm
    runtime: docker
    plan: free
    rootDir: litellm
    healthCheckPath: /health/liveness
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: JINA_API_KEY
        sync: false
      - key: LITELLM_MASTER_KEY
        generateValue: true
      - key: MALLOC_ARENA_MAX # curb glibc arena growth on the 512MB free tier
        value: "2"

  - type: web
    name: tokenroute-gateway
    runtime: docker
    plan: free
    rootDir: gateway
    healthCheckPath: /healthz
    envVars:
      - key: RUN_WORKER # demo: worker runs in-process (free tier has no workers)
        value: "1"
      - key: LITELLM_BASE_URL # public URL: fromService host is internal-only
        value: "https://tokenroute-litellm.onrender.com" # DNS and breaks chat
      - key: LITELLM_MASTER_KEY
        fromService:
          name: tokenroute-litellm
          type: web
          envVarKey: LITELLM_MASTER_KEY
      - key: REDIS_URL # Upstash rediss:// URL
        sync: false
      - key: DATABASE_URL # Neon postgres:// URL
        sync: false
      - key: EMBEDDING_DIM # jina-embeddings-v3
        value: "1024"
      - key: CLOUD_INPUT_COST_PER_MTOK # Groq gpt-oss-120b list prices, so the
        value: "0.15" # console shows notional cost even on the free tier
      - key: CLOUD_OUTPUT_COST_PER_MTOK
        value: "0.60"
